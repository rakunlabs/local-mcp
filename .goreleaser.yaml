# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: local

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/local
    binary: local
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  # No version in the name, so releases/latest/download/<name> stays stable.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: |
    **Full Changelog**: https://github.com/rakunlabs/local-mcp/compare/{{ .PreviousTag }}...{{ .Tag }}
